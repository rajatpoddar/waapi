# =====================================================================
#  WAPI - Self-Hosted WhatsApp API
#  One command to start everything:
#      docker compose up -d
#  REST API (Swagger docs):  http://<host>:2728/docs
# =====================================================================

name: wapi

services:
  baileys:
    build:
      context: ./baileys
      dockerfile: Dockerfile
    container_name: wapi-baileys
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 2729
      AUTH_DIR: /app/auth
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
    # Uncomment to expose the engine directly (advanced use, not required).
    # ports:
    #   - "2729:2729"
    volumes:
      - ./auth:/app/auth      # persistent WhatsApp sessions
      - ./uploads:/app/uploads  # media saved by the engine
      - ./logs:/app/logs      # engine logs
    networks:
      - wapi
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2729/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  fastapi:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    container_name: wapi-fastapi
    restart: unless-stopped
    ports:
      - "2728:2728"
    env_file:
      - .env
    environment:
      BAILEYS_URL: http://baileys:2729
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs      # API logs
    depends_on:
      baileys:
        condition: service_healthy
    networks:
      - wapi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:2728/health', timeout=5);print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wapi:
    driver: bridge
